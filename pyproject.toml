[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numbers4-ai-agent"
version = "0.12.0"
description = "Independent, fail-closed Numbers4 forecast advisory and evidence audit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
numbers4-agent = "numbers4_agent.cli:main"

[tool.setuptools.packages.find]
include = ["numbers4_agent*"]
