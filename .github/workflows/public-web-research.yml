name: Numbers4 Opt-in Public Web Research

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Public HTTPS URLs, one per line. Use start_index to resume long lists.'
        type: string
        required: true
      start_index:
        description: 'Zero-based resume index in supplied URL list (default 0)'
        required: false
        type: number
        default: 0
      batch_size:
        description: 'Finite URLs to fetch this job (default 25, no fixed total across reruns)'
        required: false
        type: number
        default: 25

permissions:
  contents: read

concurrency:
  group: numbers4-manual-public-web-research
  cancel-in-progress: false

jobs:
  collect-untrusted-public-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch only explicitly supplied public HTTPS URLs
        env:
          RESEARCH_URLS: ${{ inputs.urls }}
          URL_START_INDEX: ${{ inputs.start_index }}
          URL_BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from numbers4_agent.open_web import inspect_urls

          urls = [line.strip() for line in os.environ.get('RESEARCH_URLS', '').splitlines()
                  if line.strip() and not line.lstrip().startswith('#')]
          report = inspect_urls(
              urls, start_index=int(os.environ.get('URL_START_INDEX') or '0'),
              batch_size=int(os.environ.get('URL_BATCH_SIZE') or '25'))
          path = Path('/tmp/numbers4-public-web-research.json')
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2, allow_nan=False) + '\n', encoding='utf-8')
          print('Opt-in research: received', report['submitted_urls'],
                'processed', report['processed_urls'],
                'next_start_index', report['next_start_index'],
                'retrieved', report['retrieved_pages'],
                'untrusted public pages; official verification remains false.')
          assert report['official_results_verified'] is False
          assert report['production_model_promotion_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: numbers4-untrusted-public-web-research
          path: /tmp/numbers4-public-web-research.json
          retention-days: 7
